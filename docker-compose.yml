# docker-compose.yml — HRAgent 本地开发环境
# 启动：docker-compose --env-file .env.local up -d
# 业务表由数据库控制台手动创建，不自动执行 scripts/init_db.sql。
version: "3.9"

services:

  # ── PostgreSQL 主数据库（对外 5432）──
  postgres:
    image: postgres:15-alpine
    container_name: hr_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── etcd（Milvus 元数据存储，仅内部使用，不对外暴露端口）──
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: hr_agent_etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  # ── MinIO（Milvus 向量文件存储，仅内部使用，不对外暴露端口）──
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: hr_agent_minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Milvus 向量数据库（对外 19530）──
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: hr_agent_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379                 # 连内部 etcd
      MINIO_ADDRESS: minio:9000                 # 连内部 MinIO
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
# ── 数据卷（持久化，重启容器数据不丢失）──
volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
